#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "fermyon-test-outgoing"
version = "0.1.0"
authors = ["nathan lesueur <nlesueur@gmail.com>"]
description = ""

[[trigger.http]]
route = "/..."
component = "fermyon-test-outgoing"

[component.fermyon-test-outgoing]
source = "target/wasm32-wasip1/release/fermyon_test_outgoing.wasm"
allowed_outbound_hosts = []
[component.fermyon-test-outgoing.build]
command = "cargo build --target wasm32-wasip1 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
